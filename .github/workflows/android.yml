name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Новый пуш отменяет предыдущую незаконченную сборку
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Проверить секреты Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Не хватает секретов:$missing. Инструкция — в README, раздел «Сборка APK в GitHub Actions»."
            exit 1
          fi

      - name: Освободить место на диске
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - name: Скачать код
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Кэш Library (ускоряет повторные сборки)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**/*.cs') }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-

      - name: Собрать APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: Phelki
          buildMethod: Phelki.EditorTools.CiBuild.BuildAndroid
          versioning: None
          customParameters: -runNumber ${{ github.run_number }}

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: Phelki-apk-${{ github.run_number }}
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14
